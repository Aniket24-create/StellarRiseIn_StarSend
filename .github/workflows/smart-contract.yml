name: Smart Contract CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'contracts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'contracts/**'

jobs:
  build-and-test:
    name: Build & Test Soroban Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --verbose

      - name: Build WASM binary
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Check WASM binary size
        working-directory: contracts
        run: |
          WASM_FILE="target/wasm32-unknown-unknown/release/stellar_tipjar_contract.wasm"
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(wc -c < "$WASM_FILE")
            echo "✅ WASM binary built successfully"
            echo "📦 Binary size: $SIZE bytes ($(echo "scale=1; $SIZE/1024" | bc) KB)"
          else
            echo "❌ WASM binary not found"
            exit 1
          fi

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tipjar-contract-wasm
          path: contracts/target/wasm32-unknown-unknown/release/stellar_tipjar_contract.wasm
          retention-days: 30

  deploy-testnet:
    name: Deploy to Stellar Testnet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Build WASM binary
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install Stellar CLI
        run: |
          curl -L https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv stellar /usr/local/bin/
          stellar --version

      - name: Configure Stellar CLI for testnet
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"

      - name: Generate deployer keypair
        run: |
          stellar keys generate deployer --network testnet
          stellar keys address deployer

      - name: Fund deployer account via Friendbot
        run: |
          DEPLOYER_ADDRESS=$(stellar keys address deployer)
          echo "Funding: $DEPLOYER_ADDRESS"
          curl -s "https://friendbot.stellar.org?addr=$DEPLOYER_ADDRESS" | jq .

      - name: Deploy contract to testnet
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm contracts/target/wasm32-unknown-unknown/release/stellar_tipjar_contract.wasm \
            --source deployer \
            --network testnet \
            --fee 1000000)
          echo "CONTRACT_ID=$CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "✅ Contract deployed: $CONTRACT_ID"

      - name: Initialize contract
        run: |
          DEPLOYER_ADDRESS=$(stellar keys address deployer)
          stellar contract invoke \
            --id ${{ steps.deploy.outputs.CONTRACT_ID }} \
            --source deployer \
            --network testnet \
            -- init \
            --owner $DEPLOYER_ADDRESS
          echo "✅ Contract initialized with owner: $DEPLOYER_ADDRESS"

      - name: Verify contract deployment
        run: |
          stellar contract invoke \
            --id ${{ steps.deploy.outputs.CONTRACT_ID }} \
            --source deployer \
            --network testnet \
            -- get_owner
          echo "✅ Contract verified on testnet"
          echo "🔗 View on explorer: https://stellar.expert/explorer/testnet/contract/${{ steps.deploy.outputs.CONTRACT_ID }}"

      - name: Save deployment info
        run: |
          echo "CONTRACT_ID=${{ steps.deploy.outputs.CONTRACT_ID }}" >> deployment.env
          echo "NETWORK=testnet" >> deployment.env
          echo "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> deployment.env
          cat deployment.env

      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: deployment.env
