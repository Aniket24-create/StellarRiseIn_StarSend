name: Smart Contract CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '.github/workflows/smart-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/smart-contract.yml'

jobs:

  # ───────────────────────────────────────────────────────────────
  # JOB 1 — BUILD & TEST (runs on every push / PR)
  # ───────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test Soroban Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        working-directory: contracts
        run: cargo test --verbose

      - name: Build WASM binary
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Find and verify WASM file
        run: |
          FILE=$(ls contracts/target/wasm32-unknown-unknown/release/*.wasm 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: No .wasm file found"
            ls -la contracts/target/wasm32-unknown-unknown/release/ || true
            exit 1
          fi
          SIZE=$(wc -c < "$FILE")
          KB=$(awk "BEGIN { printf \"%.1f\", $SIZE / 1024 }")
          echo "WASM_FILE=${FILE}" >> $GITHUB_ENV
          echo "WASM OK: $FILE (${SIZE} bytes / ${KB} KB)"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

  # ───────────────────────────────────────────────────────────────
  # JOB 2 — DEPLOY TO STELLAR TESTNET (main branch only)
  # ───────────────────────────────────────────────────────────────
  deploy-testnet:
    name: Deploy to Stellar Testnet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM binary
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Find WASM file
        run: |
          FILE=$(ls contracts/target/wasm32-unknown-unknown/release/*.wasm 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERROR: No .wasm file found"
            exit 1
          fi
          echo "WASM_FILE=${FILE}" >> $GITHUB_ENV
          echo "Found WASM: ${FILE}"

      # Install Stellar CLI via cargo — guaranteed in PATH on ubuntu runners
      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli
          echo "Stellar CLI installed:"
          stellar --version

      - name: Debug environment
        run: |
          echo "WASM_FILE = $WASM_FILE"
          which stellar
          stellar --version

      - name: Configure Stellar testnet
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"

      - name: Generate deployer keypair
        run: |
          stellar keys generate deployer --network testnet
          DEPLOYER=$(stellar keys address deployer)
          echo "DEPLOYER_ADDRESS=${DEPLOYER}" >> $GITHUB_ENV
          echo "Deployer: ${DEPLOYER}"

      - name: Fund deployer via Friendbot
        run: |
          echo "Funding: ${DEPLOYER_ADDRESS}"
          curl -sf "https://friendbot.stellar.org?addr=${DEPLOYER_ADDRESS}" | jq .
          echo "Account funded"

      - name: Deploy contract
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM_FILE" \
            --source deployer \
            --network testnet)
          echo "CONTRACT_ID=${CONTRACT_ID}" >> $GITHUB_OUTPUT
          echo "CONTRACT_ID=${CONTRACT_ID}" >> $GITHUB_ENV
          echo "Deployed: ${CONTRACT_ID}"

      - name: Initialize contract
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            -- init \
            --owner "$DEPLOYER_ADDRESS" || true
          echo "Contract initialized"

      - name: Verify contract
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            -- get_owner
          echo "Contract verified"

      - name: Save deployment info
        run: |
          cat > deployment.env << ENVEOF
          CONTRACT_ID=${CONTRACT_ID}
          DEPLOYER=${DEPLOYER_ADDRESS}
          NETWORK=testnet
          WASM=${WASM_FILE}
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EXPLORER=https://stellar.expert/explorer/testnet/contract/${CONTRACT_ID}
          ENVEOF
          cat deployment.env

      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: deployment.env
