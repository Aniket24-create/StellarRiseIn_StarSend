name: Smart Contract CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '.github/workflows/smart-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/smart-contract.yml'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — BUILD & TEST
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test Soroban Contract
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Rust + wasm target
      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. Cache
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 4. Run tests (IMPORTANT: native only — no --target flag)
      - name: Run unit tests
        working-directory: contracts
        run: cargo test --verbose

      # 5. Build WASM
      - name: Build WASM binary
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      # 6. Verify WASM
      - name: Verify WASM binary
        working-directory: contracts
        run: |
          WASM="target/wasm32-unknown-unknown/release/stellar_tipjar_contract.wasm"
          if [ -f "$WASM" ]; then
            SIZE=$(wc -c < "$WASM")
            KB=$(awk "BEGIN { printf \"%.1f\", $SIZE / 1024 }")
            echo "✅ WASM built"
            echo "Size: ${SIZE} bytes (${KB} KB)"
          else
            echo "❌ WASM not found"
            ls -la target/wasm32-unknown-unknown/release/ || true
            exit 1
          fi

      # 7. Upload artifact
      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2 — DEPLOY
  # ─────────────────────────────────────────────
  deploy-testnet:
    name: Deploy to Stellar Testnet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust + wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      # FIX: Proper CLI install
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Configure network
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"

      - name: Generate deployer
        run: |
          stellar keys generate deployer --network testnet
          DEPLOYER=$(stellar keys address deployer)
          echo "DEPLOYER_ADDRESS=${DEPLOYER}" >> $GITHUB_ENV

      - name: Fund account
        run: |
          curl -sf "https://friendbot.stellar.org?addr=${DEPLOYER_ADDRESS}"

      - name: Deploy contract
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm contracts/target/wasm32-unknown-unknown/release/stellar_tipjar_contract.wasm \
            --source deployer \
            --network testnet)
          echo "CONTRACT_ID=${CONTRACT_ID}" >> $GITHUB_OUTPUT
          echo "CONTRACT_ID=${CONTRACT_ID}" >> $GITHUB_ENV

      - name: Initialize contract
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            -- init \
            --owner "$DEPLOYER_ADDRESS"

      - name: Verify contract
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            -- get_owner

      - name: Save deployment
        run: |
          cat <<EOF > deployment.env
          CONTRACT_ID=${CONTRACT_ID}
          DEPLOYER=${DEPLOYER_ADDRESS}
          NETWORK=testnet
          EOF

      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: deployment.env
