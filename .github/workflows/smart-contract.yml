name: Smart Contract CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'contracts/**'
      - '.github/workflows/smart-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/smart-contract.yml'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — BUILD & TEST
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test Soroban Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # PATCH A: Install jq before any curl/jq usage
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Run tests on NATIVE host — no --target flag
      - name: Run unit tests
        working-directory: contracts
        run: cargo test --verbose

      - name: Build WASM binary
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      # PATCH B: Find WASM file dynamically
      - name: Find WASM file
        id: wasm
        run: |
          FILE=$(ls contracts/target/wasm32-unknown-unknown/release/*.wasm | head -n 1)
          echo "WASM_FILE=$FILE" >> $GITHUB_ENV
          echo "Found WASM: $FILE"

      - name: Verify WASM binary
        run: |
          if [ -f "$WASM_FILE" ]; then
            SIZE=$(wc -c < "$WASM_FILE")
            KB=$(awk "BEGIN { printf \"%.1f\", $SIZE / 1024 }")
            echo "✅ WASM built: $WASM_FILE"
            echo "Size: ${SIZE} bytes (${KB} KB)"
          else
            echo "❌ WASM not found"
            ls -la contracts/target/wasm32-unknown-unknown/release/ || true
            exit 1
          fi

      - name: Upload WASM
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2 — DEPLOY
  # ─────────────────────────────────────────────
  deploy-testnet:
    name: Deploy to Stellar Testnet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust + wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # PATCH A: Install jq
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build WASM
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release

      # PATCH B: Find WASM file dynamically
      - name: Find WASM file
        run: |
          FILE=$(ls contracts/target/wasm32-unknown-unknown/release/*.wasm | head -n 1)
          echo "WASM_FILE=$FILE" >> $GITHUB_ENV
          echo "Found WASM: $FILE"

      # PATCH D: Faster + stable Stellar CLI install
      - name: Install Stellar CLI
        run: |
          curl -sSf https://stellar.org/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure network
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org \
            --network-passphrase "Test SDF Network ; September 2015"

      - name: Generate deployer
        run: |
          stellar keys generate deployer --network testnet
          DEPLOYER=$(stellar keys address deployer)
          echo "DEPLOYER_ADDRESS=${DEPLOYER}" >> $GITHUB_ENV
          echo "Deployer: ${DEPLOYER}"

      - name: Fund account
        run: |
          echo "Funding: ${DEPLOYER_ADDRESS}"
          curl -sf "https://friendbot.stellar.org?addr=${DEPLOYER_ADDRESS}" | jq .
          echo "✅ Account funded"

      - name: Deploy contract
        id: deploy
        run: |
          CONTRACT_ID=$(stellar contract deploy \
            --wasm "$WASM_FILE" \
            --source deployer \
            --network testnet)
          echo "CONTRACT_ID=${CONTRACT_ID}" >> $GITHUB_OUTPUT
          echo "CONTRACT_ID=${CONTRACT_ID}" >> $GITHUB_ENV
          echo "✅ Deployed: ${CONTRACT_ID}"

      # PATCH C: || true prevents failure if already initialized
      - name: Initialize contract
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            -- init \
            --owner "$DEPLOYER_ADDRESS" || true

      - name: Verify contract
        run: |
          stellar contract invoke \
            --id "$CONTRACT_ID" \
            --source deployer \
            --network testnet \
            -- get_owner
          echo "✅ Contract verified"

      - name: Save deployment
        run: |
          cat <<EOF > deployment.env
          CONTRACT_ID=${CONTRACT_ID}
          DEPLOYER=${DEPLOYER_ADDRESS}
          NETWORK=testnet
          WASM=${WASM_FILE}
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EXPLORER=https://stellar.expert/explorer/testnet/contract/${CONTRACT_ID}
          EOF
          cat deployment.env

      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: deployment.env
