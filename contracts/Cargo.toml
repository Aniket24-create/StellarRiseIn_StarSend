# [workspace] stops Cargo from walking up to the repo root.
# Without it CI fails because there is no root-level Cargo.toml.
[workspace]

[package]
name = "stellar-tipjar-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.7.6"

# testutils feature is ONLY compiled for `cargo test` (dev profile).
# It must NOT appear in [dependencies] or the wasm build breaks.
[dev-dependencies]
soroban-sdk = { version = "21.7.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
panic = "abort"
lto = true
codegen-units = 1
